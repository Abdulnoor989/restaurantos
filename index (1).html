<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Marhaba Calgary · RestaurantOS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#EEF2F0;--surface:#FFFFFF;--ink:#14201C;--mute:#5B6B65;--line:#D5DDD9;--green:#1F4D3F;--onGreen:#FFFFFF;--gold:#E0A21B;--red:#B8352A;--redBg:#F8E3E0;--okBg:#DDEDE6;
--head:"Bricolage Grotesque",system-ui,sans-serif;--body:"Source Sans 3",system-ui,sans-serif;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0F1714;--surface:#18231F;--ink:#E8EFEC;--mute:#9AAAA3;--line:#2C3B35;--green:#5DBB98;--onGreen:#0F1714;--gold:#F0B83A;--red:#F07A6E;--redBg:#3A1F1C;--okBg:#1D3A2F}}
:root[data-theme="dark"]{--bg:#0F1714;--surface:#18231F;--ink:#E8EFEC;--mute:#9AAAA3;--line:#2C3B35;--green:#5DBB98;--onGreen:#0F1714;--gold:#F0B83A;--red:#F07A6E;--redBg:#3A1F1C;--okBg:#1D3A2F}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.45 var(--body);padding-bottom:84px}
main{max-width:720px;margin:0 auto;padding:16px}
h1,h2,h3{font-family:var(--head);margin:0;letter-spacing:-.01em}
h1{font-size:26px}h2{font-size:18px;margin:24px 0 8px}
.sub{color:var(--mute);font-size:14px;margin:2px 0 16px}
.hero{background:var(--green);color:var(--onGreen);border-radius:14px;padding:18px}
.hero .big{font:700 40px/1.1 var(--head)}
.hero small{opacity:.85;font-size:14px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px}
.stat b{display:block;font:700 22px var(--head)}
.stat span{color:var(--mute);font-size:14px}
.list{background:var(--surface);border:1px solid var(--line);border-radius:10px}
.item{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0}
.item small{color:var(--mute);display:block}
.tag{font-size:13px;font-weight:600;padding:2px 8px;border-radius:99px;background:var(--okBg);color:var(--green)}
.tag.bad{background:var(--redBg);color:var(--red)}
button{font:600 14px var(--body);min-height:40px;padding:0 14px;border-radius:8px;border:1px solid var(--green);background:var(--green);color:var(--onGreen);cursor:pointer}
button.ghost{background:transparent;color:var(--green)}
button:focus-visible,nav a:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;margin:8px 0}
.seg button{border:0;border-radius:0;background:var(--surface);color:var(--mute)}
.seg button[aria-pressed="true"]{background:var(--green);color:var(--onGreen)}
.bars{display:flex;align-items:flex-end;gap:8px;height:140px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 12px 8px}
.bar{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;font-size:12px;color:var(--mute)}
.bar i{display:block;width:100%;background:var(--green);border-radius:4px 4px 0 0;min-height:2px}
.bar.last i{background:var(--gold)}
.flow{display:flex;height:14px;border-radius:7px;overflow:hidden;margin:10px 0 6px}
.meter{height:8px;background:var(--line);border-radius:4px;margin-top:6px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--green)}
.meter.low i{background:var(--red)}
.step{display:inline-flex;gap:6px;align-items:center}
.step button{min-width:40px;padding:0}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom,0px)}
nav div{display:flex;width:100%;max-width:720px}
nav a{flex:1;text-align:center;padding:12px 2px;color:var(--mute);text-decoration:none;font-size:12px;font-weight:600}
nav a[aria-current="page"]{color:var(--green);box-shadow:inset 0 3px var(--gold)}
.note{font-size:13px;color:var(--mute);margin-top:10px}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.on{opacity:1}
[hidden]{display:none!important}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<main id="app" aria-live="polite"></main>
<nav aria-label="Main"><div>
<a href="#overview" data-v="overview">Home</a>
<a href="#sales" data-v="sales">Sales</a>
<a href="#profit" data-v="profit">Profit</a>
<a href="#stock" data-v="stock">Stock</a>
<a href="#suppliers" data-v="suppliers">Bills</a>
<a href="#menu" data-v="menu">Menu</a>
<a href="#staff" data-v="staff">Staff</a>
</div></nav>
<div class="toast" id="toast" role="status"></div>
<script>
var S={
 period:'week',
 fixed:{rent:800000,inv:500000,debt:300000},
 menu:[{n:'Chicken Shawarma',p:1299,c:420},{n:'Lamb Donair',p:1499,c:650},{n:'Vegetable Samosa (2 pc.)',p:499,c:120},{n:'Chaat Papri',p:1199,c:280},{n:'Chicken Mandi',p:1699,c:560},{n:'Chicken Kabsa',p:1699,c:560},{n:'Lamb Mandi',p:1899,c:880},{n:'Tandoori Pomfret Mandi',p:1699,c:780},{n:'Chicken Tikka',p:1699,c:540},{n:'Tandoori Prawn',p:1999,c:920},{n:'Beef Boti Kebab',p:2399,c:1050},{n:'Lamb Chops',p:2399,c:1200},{n:'BBQ Platter',p:3499,c:1300},{n:'Butter Chicken',p:1699,c:520},{n:'Mutton Rogan Josh',p:1999,c:950},{n:'Beef Curry',p:1799,c:780},{n:'Paneer Butter Masala',p:1599,c:480},{n:'Dal Makhni',p:1599,c:220},{n:'Chana Masala',p:1499,c:200},{n:'Garlic Naan',p:399,c:70},{n:'Mango Lassi',p:499,c:140},{n:'Gulab Jamun (3 pc.)',p:599,c:150}],
 sales:{week:[['Mon',1200],['Tue',0],['Wed',1156],['Thu',1300],['Fri',2000],['Sat',2500],['Sun',1900]],month:[['Wk 1',9800],['Wk 2',10100],['Wk 3',10700],['Wk 4',10056]]},
 expensesToday:68000,
 stock:[{n:'Chicken (biryani, kabsa)',q:18,min:10,u:'kg',c:900},{n:'Basmati rice',q:35,min:15,u:'kg',c:300},{n:'Lamb shanks (mandi)',q:9,min:12,u:'kg',c:1600},{n:'Yoghurt (raita)',q:6,min:4,u:'L',c:500},{n:'Cooking oil',q:4,min:8,u:'L',c:650},{n:'Basa fish (pakora)',q:5,min:3,u:'kg',c:1100}],
 inv:[{n:'Halal meat supplier',tot:120000,paid:50000},{n:'Spices & dry goods',tot:60000,paid:0},{n:'Cleaning supplier',tot:25000,paid:25000},{n:'Produce supplier',tot:245000,paid:0}],
 staff:[{n:'Chef 1',h:40,r:2400,ok:true},{n:'Chef 2',h:36,r:2200,ok:false},{n:'Kitchen helper (boy)',h:32,r:1600,ok:false},{n:'Kitchen helper (girl)',h:30,r:1600,ok:false},{n:'Dishwasher',h:28,r:1500,ok:false}]
};
var $=function(s){return document.querySelector(s)};
function money(c){return (c<0?'-':'')+'$'+Math.abs(Math.round(c/100)).toLocaleString('en-CA')}
function money2(c){return '$'+(c/100).toLocaleString('en-CA',{minimumFractionDigits:2,maximumFractionDigits:2})}
function toast(t){var e=$('#toast');e.textContent=t;e.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(function(){e.classList.remove('on')},1800)}
function low(){return S.stock.filter(function(s){return s.q<s.min})}
function owed(){return S.inv.filter(function(i){return i.tot>i.paid})}
function debt(){return S.inv.reduce(function(a,i){return a+i.tot-i.paid},0)}
function pending(){return S.staff.filter(function(e){return !e.ok})}
function head(t,s){return '<h1>'+t+'</h1><p class="sub">'+s+'</p>'}
var V={
overview:function(){
 var l=low().length,o=owed().length,p=pending().length;
 var val=S.stock.reduce(function(a,s){return a+s.q*s.c},0);
 var today=S.sales.week[6][1]*100;
 return head('Marhaba Calgary','Halal Arabic & Indian kitchen · sample figures for preview')+
 '<section class="hero"><small>Today’s sales</small><div class="big">'+money(today)+'</div><small>Deposit expected tomorrow: see Sales</small></section>'+
 '<div class="row"><div class="stat"><span>Expenses today</span><b>'+money(S.expensesToday)+'</b></div><div class="stat"><span>Stock value</span><b>'+money(val)+'</b></div></div>'+
 '<div class="row"><div class="stat"><span>Supplier debt</span><b>'+money(debt())+'</b></div><div class="stat"><span>Estimated wages (week)</span><b>'+money(S.staff.reduce(function(a,e){return a+e.h*e.r},0))+'</b></div></div>'+
 '<h2>Today’s priorities</h2><div class="list">'+
 pr(l,'ingredient'+(l==1?' is':'s are')+' running low','#stock')+
 pr(o,'supplier invoice'+(o==1?'':'s')+' awaiting payment','#suppliers')+
 pr(p,'timesheet'+(p==1?'':'s')+' awaiting approval','#staff')+
 '<a class="item" href="#sales" style="color:inherit;text-decoration:none"><span>Yesterday’s sales report is ready</span><span class="tag">View</span></a></div>';
},
sales:function(){
 var d=S.sales[S.period],mx=Math.max.apply(null,d.map(function(x){return x[1]})),tot=d.reduce(function(a,x){return a+x[1]},0);
 var bars=d.map(function(x,i){return '<div class="bar'+(i==d.length-1?' last':'')+'"><i style="height:'+Math.round(x[1]/mx*100)+'%"></i>'+x[0]+'</div>'}).join('');
 var g=190000,fee=5000,ref=2500,net=g-fee-ref;
 return head('Sales','Dine-in, take-out and online orders (Tuesday: closed)')+
 '<div class="seg" role="group" aria-label="Period"><button aria-pressed="'+(S.period=='week')+'" data-p="week">Week</button><button aria-pressed="'+(S.period=='month')+'" data-p="month">Month</button></div>'+
 '<div class="stat" style="margin-bottom:10px"><span>Total, '+(S.period=='week'?'last 7 days':'last 4 weeks')+'</span><b>'+money(tot*100)+'</b></div><div class="bars" aria-label="Sales chart">'+bars+'</div>'+
 '<h2>Sales are not deposits</h2><div class="list">'+
 '<div class="item"><span>Gross sales today</span><b>'+money2(g)+'</b></div>'+
 '<div class="item"><span>Processing fees</span><b>-'+money2(fee)+'</b></div>'+
 '<div class="item"><span>Refunds</span><b>-'+money2(ref)+'</b></div>'+
 '<div class="item"><span><b>Expected deposit</b><small>Arrives next business day</small></span><b>'+money2(net)+'</b></div></div>'+
 '<p class="note">Tips and taxes are tracked separately from sales.</p>';
},
stock:function(){
 return head('Stock','Estimated from purchases, wastage and recipes')+'<div class="list">'+S.stock.map(function(s,i){
  var isLow=s.q<s.min,w=Math.min(100,Math.round(s.q/(s.min*2)*100));
  return '<div class="item"><div style="flex:1"><b>'+s.n+'</b> '+(isLow?'<span class="tag bad">Low</span>':'')+'<small>'+s.q+' '+s.u+' on hand · minimum '+s.min+' '+s.u+'</small><div class="meter'+(isLow?' low':'')+'"><i style="width:'+w+'%"></i></div></div>'+
  '<div class="step"><button class="ghost" data-s="'+i+'" data-d="-1" aria-label="Record 1 '+s.u+' of '+s.n+' used or wasted">−</button><button class="ghost" data-s="'+i+'" data-d="1" aria-label="Add 1 '+s.u+' of '+s.n+'">+</button></div></div>'}).join('')+'</div>'+
  '<p class="note">Each tap records a stock movement (a purchase or wastage), not a silent edit. Quantities are estimates: staff meals, waste and portions vary.</p>';
},
suppliers:function(){
 return head('Bills','Supplier invoices and what you still owe')+
 '<div class="stat" style="margin-bottom:10px"><span>Total outstanding</span><b>'+money(debt())+'</b></div><div class="list">'+S.inv.map(function(v,i){
  var left=v.tot-v.paid;
  return '<div class="item"><span><b>'+v.n+'</b><small>Invoice '+money(v.tot)+' · paid '+money(v.paid)+'</small></span>'+
  (left>0?'<span style="text-align:right"><b>'+money(left)+'</b><br><button data-i="'+i+'">Record payment</button></span>':'<span class="tag">Paid</span>')+'</div>'}).join('')+'</div>';
},
profit:function(){
 var wk=S.staff.reduce(function(a,e){return a+e.h*e.r},0),wages=wk*4,f=S.fixed,wks=S.sales.month;
 var sales=wks.reduce(function(a,x){return a+x[1]},0)*100,profit=sales-f.rent-f.inv-f.debt-wages,pct=Math.round(profit/sales*100);
 function line(l,c,k){return '<div class="item"><span>'+l+'</span><span style="display:flex;align-items:center;gap:8px"><b>'+money(-c)+'</b>'+(k?'<span class="step"><button class="ghost" data-f="'+k+'" data-d="-50000" aria-label="Lower '+l+' by $500">−</button><button class="ghost" data-f="'+k+'" data-d="50000" aria-label="Raise '+l+' by $500">+</button></span>':'')+'</span></div>'}
 var weeks=wks.map(function(x){var p=x[1]*100-(f.rent+f.inv+f.debt)/4-wk;return '<div class="item"><span><b>'+x[0]+'</b><small>Sales '+money(x[1]*100)+'</small></span><b style="color:'+(p<0?'var(--red)':'var(--green)')+'">'+money(p)+'</b></div>'}).join('');
 return head('Profit','This month · sample figures')+
 '<section class="hero"><small>Estimated profit this month</small><div class="big">'+money(profit)+'</div><small>'+pct+'% of sales</small></section>'+
 '<h2>Where the money goes</h2><div class="list"><div class="item"><span><b>Sales</b></span><b>'+money(sales)+'</b></div>'+line('Rent',f.rent,'rent')+line('Inventory',f.inv,'inv')+line('Employee wages',wages)+line('Debt payoff',f.debt,'debt')+'<div class="item"><span><b>Profit</b></span><b>'+money(profit)+'</b></div></div>'+
 '<h2>Profit by week</h2><div class="list">'+weeks+'</div>'+
 '<p class="note">Rent, inventory and debt payoff are split evenly across the four weeks. Wages are estimated gross pay for four weeks of current hours, before CPP, EI and vacation pay. The full debt payoff is counted as a cost here; in accounting only the interest is an expense. Tap − or + to test a change.</p>';
},
menu:function(){
 var rows=S.menu.map(function(m,i){var pct=Math.round(m.c/m.p*100),hi=pct>35;
  return '<div class="item"><div style="flex:1"><b>'+m.n+'</b> <span class="tag'+(hi?' bad':'')+'">'+pct+'% food cost</span><small>Price '+money2(m.p)+' · cost '+money2(m.c)+' · you keep '+money2(m.p-m.c)+'</small></div><div class="step"><button class="ghost" data-m="'+i+'" data-d="-50" aria-label="Lower cost of '+m.n+'">−</button><button class="ghost" data-m="'+i+'" data-d="50" aria-label="Raise cost of '+m.n+'">+</button></div></div>'}).join('');
 return head('Menu costing','Prices from the menu · ingredient costs are samples')+'<div class="list">'+rows+'</div><p class="note">Tap − or + to change a dish’s ingredient cost by 50¢ and watch the margin move. Red means food cost above 35% of the price.</p>';
},
staff:function(){
 return head('Staff','Hours and estimated gross wages')+'<div class="list">'+S.staff.map(function(e,i){
  return '<div class="item"><span><b>'+e.n+'</b><small>'+e.h+' h × '+money2(e.r)+'/h = '+money(e.h*e.r)+'</small></span>'+
  (e.ok?'<span class="tag">Approved</span>':'<button data-e="'+i+'">Approve hours</button>')+'</div>'}).join('')+'</div>'+
  '<p class="note">Estimates only, before income tax, CPP, EI and vacation pay. Use a compliant payroll provider for actual pay.</p>';
}};
function pr(n,t,h){return n?'<a class="item" href="'+h+'" style="color:inherit;text-decoration:none"><span><b>'+n+'</b> '+t+'</span><span class="tag bad">Review</span></a>':''}
function render(){
 var v=(location.hash||'#overview').slice(1);if(!V[v])v='overview';
 $('#app').innerHTML=V[v]();
 document.querySelectorAll('nav a').forEach(function(a){if(a.dataset.v==v)a.setAttribute('aria-current','page');else a.removeAttribute('aria-current')});
}
document.addEventListener('click',function(ev){
 var b=ev.target.closest('button');if(!b)return;
 if(b.dataset.p){S.period=b.dataset.p}
 else if(b.dataset.s!==undefined){var s=S.stock[b.dataset.s];s.q=Math.max(0,s.q+Number(b.dataset.d));toast(Number(b.dataset.d)>0?'Purchase recorded':'Usage recorded')}
 else if(b.dataset.i!==undefined){var v=S.inv[b.dataset.i];v.paid=v.tot;toast('Payment recorded')}
 else if(b.dataset.f!==undefined){S.fixed[b.dataset.f]=Math.max(0,S.fixed[b.dataset.f]+Number(b.dataset.d))}
 else if(b.dataset.m!==undefined){var m=S.menu[b.dataset.m];m.c=Math.max(50,m.c+Number(b.dataset.d))}
 else if(b.dataset.e!==undefined){S.staff[b.dataset.e].ok=true;toast('Hours approved')}
 else return;
 render();
});
addEventListener('hashchange',function(){render();scrollTo(0,0)});
render();
</script>
</body>
</html>
